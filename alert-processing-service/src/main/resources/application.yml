# ============================================================
#  alert-processing-service — Spring Boot configuration
# ============================================================

server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: alert-processing-service
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: alert-processing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.johndeere.agrio.*"

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# ---------- Logging ----------
logging:
  level:
    root: INFO
    com.johndeere.agrio: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/agrio_db?currentSchema=alert}
    username: ${SPRING_DATASOURCE_USERNAME:agrio_alert}
    password: ${SPRING_DATASOURCE_PASSWORD:agrio_alert_pwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # `INIT=CREATE SCHEMA IF NOT EXISTS ALERT` ensures the
    # `alert` schema exists before Hibernate tries to drop /
    # create tables inside it. The H2 URL in PostgreSQL mode
    # uppercases unquoted identifiers, so we must match the
    # schema name as Hibernate emits it.
    url: jdbc:h2:mem:alert-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS ALERT
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
