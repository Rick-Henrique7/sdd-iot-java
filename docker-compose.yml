# ============================================================
#  Agro-IoT Platform — local development stack
#  Brings up: PostgreSQL, Redis, Kafka, Zookeeper, all
#  microservices, the IoT simulator and the front-end shell.
# ============================================================
# Compose v2 no longer requires the `version` attribute; it is
# ignored and triggers a warning if present.

services:
  # ===================== INFRASTRUCTURE =====================
  postgres:
    image: postgres:15-alpine
    container_name: agrio-postgres
    environment:
      POSTGRES_DB: agrio_db
      POSTGRES_USER: agrio_user
      POSTGRES_PASSWORD: agrio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrio_user -d agrio_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrio-network

  redis:
    image: redis:7.0-alpine
    container_name: agrio-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrio-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: agrio-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # Plain TCP check — `echo ruok | nc` is flaky on this image
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - agrio-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: agrio-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - agrio-network

  # ===================== MICROSERVICES =====================
  # NOTE: only api-gateway is built in this compose. The other
  # services are scaffolded (pom.xml + README) but their Dockerfile
  # and source land in subsequent SDD changes (002..006). When each
  # is implemented, uncomment its block here and add the build
  # context + Dockerfile.

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: agrio-api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agrio-network

  # ---- ENABLED in Change 002 ----
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: agrio-auth-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agrio_db?currentSchema=auth
      - SPRING_DATASOURCE_USERNAME=agrio_auth
      - SPRING_DATASOURCE_PASSWORD=agrio_auth_pwd
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agrio-network

  # ---- ENABLED in Change 003 ----
  telemetry-ingestion-service:
    build:
      context: .
      dockerfile: telemetry-ingestion-service/Dockerfile
    container_name: agrio-telemetry-ingestion
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agrio_db?currentSchema=telemetry
      - SPRING_DATASOURCE_USERNAME=agrio_telemetry
      - SPRING_DATASOURCE_PASSWORD=agrio_telemetry_pwd
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agrio-network

  # ---- ENABLED in Change 004 ----
  alert-processing-service:
    build:
      context: .
      dockerfile: alert-processing-service/Dockerfile
    container_name: agrio-alert-processing
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agrio-network

  # ---- ENABLED in Change 005 ----
  fleet-mapping-service:
    build:
      context: .
      dockerfile: fleet-mapping-service/Dockerfile
    container_name: agrio-fleet-mapping
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agrio_db?currentSchema=fleet
      - SPRING_DATASOURCE_USERNAME=agrio_fleet
      - SPRING_DATASOURCE_PASSWORD=agrio_fleet_pwd
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agrio-network

  # ---- ENABLED in Change 019 ----
  field-operation-service:
    build:
      context: .
      dockerfile: field-operation-service/Dockerfile
    container_name: agrio-field-operation
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agrio_db?currentSchema=operations
      - SPRING_DATASOURCE_USERNAME=agrio_operations
      - SPRING_DATASOURCE_PASSWORD=agrio_operations_pwd
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - agrio-network

  # ---- ENABLED in Change 006 ----
  iot-simulator-service:
    build:
      context: .
      dockerfile: iot-simulator-service/Dockerfile
    container_name: agrio-iot-simulator
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=agri.telemetry.raw
      - SIM_INTERVAL_MS=1000
      # Silence KafkaJS v2 partitioner migration warning.
      - KAFKAJS_NO_PARTITIONER_WARNING=1
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agrio-network

  # ---- ENABLED in Change 007 ----
  frontend-shell:
    build:
      context: .
      dockerfile: frontend-shell/Dockerfile
    container_name: agrio-frontend-shell
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
      # WS broker lives on the alert-processing service
      # (Spring STOMP @ /ws). The browser reaches it directly
      # via the host port 8082 (mapped to the container by
      # `alert-processing-service` above). The reactive api-
      # gateway does not proxy WebSockets, so we go around it
      # for the STOMP connection.
      - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8082/ws
      - NODE_ENV=production
    depends_on:
      - api-gateway
      - alert-processing-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login | grep -q -i login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - agrio-network

volumes:
  postgres_data:

networks:
  agrio-network:
    driver: bridge
