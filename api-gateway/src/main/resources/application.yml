# ============================================================
#  api-gateway — Spring Cloud Gateway configuration
#  All behavior is defined in:
#    changes/001-api-gateway/spec.md
#    docs/backend/microservices-specification/api-gateway.md
# ============================================================

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
    banner-mode: off
  cloud:
    gateway:
      # ---------- CORS (centralized for the Next.js shell) ----------
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # ---------- Routes (single source of truth for routing) ----------
      routes:
        # 1) Auth — public
        - id: auth-service-public
          uri: http://auth-service:8083
          predicates:
            - Path=/api/v1/auth/**

        # 2) Fleet & mapping — protected
        - id: fleet-mapping-service
          uri: http://fleet-mapping-service:8084
          predicates:
            - Path=/api/v1/fleet/**, /api/v1/mapping/**
          filters:
            - name: JwtAuthenticationFilter

        # 3) Telemetry ingestion — protected
        - id: telemetry-service
          uri: http://telemetry-ingestion-service:8081
          predicates:
            - Path=/api/v1/telemetry/**
          filters:
            - name: JwtAuthenticationFilter

        # 4) Alert processing — protected (REST side; WS is future work)
        - id: alert-processing-service
          uri: http://alert-processing-service:8082
          predicates:
            - Path=/api/v1/alerts/**
          filters:
            - name: JwtAuthenticationFilter

        # 5) Field operation — protected (ENABLED in Change 019)
        - id: field-operation-service
          uri: http://field-operation-service:8085
          predicates:
            - Path=/api/v1/operations/**
          filters:
            - name: JwtAuthenticationFilter

  # ---------- Resilience4j (baseline, no policies enabled) ----------
  resilience4j:
    circuitbreaker:
      configs:
        default:
          registerHealthIndicator: false
    ratelimiter:
      configs:
        default:
          registerHealthIndicator: false

# ---------- JWT ----------
jwt:
  # 256-bit secret for HS256. In production, MUST be injected via env.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}

# ---------- Actuator (probes) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# ---------- Logging ----------
logging:
  level:
    root: INFO
    com.johndeere.agrio: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

logging:
  level:
    com.johndeere.agrio: INFO
