# ============================================================
#  Agro-IoT Platform — Docker image build (push to main only)
#
#  Builds the api-gateway and auth-service images on every push
#  to main. Each image is pushed to the GitHub Container Registry
#  (ghcr.io) tagged with the short SHA.
#
#  Note: when more services are implemented, add them to the
#  `services` matrix below.
# ============================================================

name: Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build & push image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            dockerfile: api-gateway/Dockerfile
          - name: auth-service
            dockerfile: auth-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agrio-${{ matrix.service.name }}:latest
            ghcr.io/${{ github.repository_owner }}/agrio-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
