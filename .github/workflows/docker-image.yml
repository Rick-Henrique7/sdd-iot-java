# ============================================================
#  Agro-IoT Platform — Docker image build (push to main only)
#
#  Builds one image per service and pushes it to the GitHub
#  Container Registry (ghcr.io) tagged with the short SHA.
#
#  Note: the matrix is built with the `include` form rather than
#  a list-of-objects because GitHub Actions has historically
#  mis-rendered `matrix.<list>.name` as the literal string
#  "Object" — which then broke the tag and made the build fail.
# ============================================================

name: Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build & push image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Plain list of names so each job name is the service
        # itself (no "Object" artefacts). The `include` block
        # attaches the matching Dockerfile path.
        service:
          - api-gateway
          - auth-service
          - telemetry-ingestion-service
          - alert-processing-service
          - fleet-mapping-service
          - frontend-shell
        include:
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
          - service: auth-service
            dockerfile: auth-service/Dockerfile
          - service: telemetry-ingestion-service
            dockerfile: telemetry-ingestion-service/Dockerfile
          - service: alert-processing-service
            dockerfile: alert-processing-service/Dockerfile
          - service: fleet-mapping-service
            dockerfile: fleet-mapping-service/Dockerfile
          - service: frontend-shell
            dockerfile: frontend-shell/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the image name (GHCR is strict)
        id: canon
        # `github.repository_owner` is "Rick-Henrique7" with mixed
        # case. GHCR rejects the tag when the OWNER part is mixed
        # case in some buildx versions, so we normalise to all
        # lowercase here and reuse the result in the next step.
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=agrio-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Build (and push, on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.canon.outputs.owner }}/agrio-${{ matrix.service }}:latest
            ghcr.io/${{ steps.canon.outputs.owner }}/agrio-${{ matrix.service }}:${{ github.sha }}
