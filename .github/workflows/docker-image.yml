# ============================================================
#  Agro-IoT Platform — Docker image build (push to main only)
#
#  Builds one image per service and pushes it to the GitHub
#  Container Registry (ghcr.io) tagged with the short SHA.
#
#  Note: the matrix is built with the `include` form rather than
#  a list-of-objects because GitHub Actions has historically
#  mis-rendered `matrix.<list>.name` as the literal string
#  "Object" — which then broke the tag and made the build fail
#  with "repository name must be lowercase".
# ============================================================

name: Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build & push image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Use the include form so each service carries its
        # own `dockerfile` next to the simple `service` name.
        service:
          - api-gateway
          - auth-service
          - telemetry-ingestion-service
          - alert-processing-service
          - fleet-mapping-service
        include:
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
          - service: auth-service
            dockerfile: auth-service/Dockerfile
          - service: telemetry-ingestion-service
            dockerfile: telemetry-ingestion-service/Dockerfile
          - service: alert-processing-service
            dockerfile: alert-processing-service/Dockerfile
          - service: fleet-mapping-service
            dockerfile: fleet-mapping-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agrio-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/agrio-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
